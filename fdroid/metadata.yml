AutoName: Vanta
Summary: Brutalist Windows Phone Metro-inspired launcher with live tiles
Description: |-
    Vanta is a brutalist Android launcher inspired by the Windows Phone 8.1 / 10
    Lumia Metro UI. It blends the classic live-tile aesthetic with modern
    productivity features, built for daily-driver use on any Android 11+ device.

    Four-pivot workflow: Home, Apps, Focus, Live.

    Features:
    * Live tiles with flip animations and random timing
    * 4-page pivot navigation (swipe + tap)
    * Auto dark mode (system / sunset / manual)
    * Auto refresh rate (60/90/120Hz auto, battery-safe)
    * Tablet + foldable adaptive layouts
    * 48 accent colors + 6 themes
    * Material You dynamic color (Android 12+)
    * Icon pack support (Lawnicon format)
    * Recents app switcher
    * Quick Settings panel
    * Notification badges
    * Web search + history
    * Backup / Restore (JSON export/import)
    * Hindi + Spanish localization
    * TalkBack accessibility
    * First-run onboarding

    Privacy: No tracking, no cloud sync, no analytics, no ads. All data stays on
    your device.

    Built with Kotlin + Jetpack Compose. Open source under Apache 2.0.

